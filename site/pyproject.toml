[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annotation-mtbc-site"
version = "0.1.0"
description = "Web front-end for the MTBC functional re-annotation (Mycobrowser successor), anchored on the MTBC0 ancestral genome"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Christophe Guyeux", email = "guyeux@gmail.com" }]
license = { text = "CC-BY-4.0" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-multipart>=0.0.9",
    "markdown>=3.5",
    "mcp>=1.0",
]

[project.optional-dependencies]
prod = ["psycopg2-binary>=2.9", "gunicorn>=21"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py310"
