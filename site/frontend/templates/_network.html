{# Reusable STRING ego-network SVG (server-rendered). `graph` = dict from _network_graph(). #}
{% macro network_svg(graph) %}
<div class="net-graph" style="overflow-x:auto; border:1px solid #e3e3e3; border-radius:6px; background:#fafafa">
  <svg viewBox="0 0 {{ graph.width }} {{ graph.height }}" width="100%" style="min-width:620px; display:block"
       font-family="system-ui, sans-serif">
    {% for e in graph.edges %}
    <line x1="{{ e.x1 }}" y1="{{ e.y1 }}" x2="{{ e.x2 }}" y2="{{ e.y2 }}"
          stroke="{{ e.color }}" stroke-width="{{ e.w }}" stroke-opacity="{{ e.op }}"/>
    {% endfor %}
    {% for n in graph.nodes %}
    <a href="{{ n.href }}">
      <title>{{ n.title }}</title>
      <circle cx="{{ n.x }}" cy="{{ n.y }}" r="{{ n.r }}" fill="{{ n.color }}"
              stroke="{% if n.is_center %}#111{% else %}#ffffff{% endif %}"
              stroke-width="{% if n.is_center %}2.5{% else %}1{% endif %}"
              {% if n.hypothetical %}stroke-dasharray="2.5,2"{% endif %}/>
      {% if n.is_center %}
      <text x="{{ n.x }}" y="{{ n.y + 4 }}" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">{{ n.name[:9] }}</text>
      {% else %}
      <text x="{{ n.tx }}" y="{{ n.y + 4 }}" text-anchor="{{ n.anchor }}" font-size="10" fill="#333">{{ n.name }}</text>
      {% endif %}
    </a>
    {% endfor %}
  </svg>
</div>
{% endmacro %}
